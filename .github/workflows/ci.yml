name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'

      - name: Configure MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      # The manifest is load bearing (ADR-4): without it Windows applies its
      # pre-Windows-8 compatibility behaviour, WS_EX_LAYERED is refused on a
      # child window and the hosted zones are never drawn -- silently. The build
      # turns MSVC's own manifest generation off (src/CMakeLists.txt) and lets
      # starfish.rc supply ours, so this step proves the resource really landed
      # in the binary instead of trusting the link to have kept it.
      - name: Check the embedded manifest
        shell: cmd
        run: |
          mt.exe -nologo -inputresource:build\starfish.exe;#1 -out:embedded.manifest
          findstr /C:"supportedOS" embedded.manifest

      - name: Test
        run: ctest --test-dir build --output-on-failure
