name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'

      # ilammy/msvc-dev-cmd still runs on Node 20 (deprecated): the same job --
      # vcvars64 from vswhere, its environment exported to the next steps.
      - name: Configure MSVC dev environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          }

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      # The manifest is load bearing (ADR-4): without it Windows applies its
      # pre-Windows-8 compatibility behaviour, WS_EX_LAYERED is refused on a
      # child window and the hosted zones are never drawn -- silently. The build
      # turns MSVC's own manifest generation off (src/CMakeLists.txt) and lets
      # starfish.rc supply ours, so this step proves the resource really landed
      # in the binary instead of trusting the link to have kept it.
      - name: Check the embedded manifest
        shell: cmd
        run: |
          mt.exe -nologo -inputresource:build\starfish.exe;#1 -out:embedded.manifest
          findstr /C:"supportedOS" embedded.manifest

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # STATE.md and TODO.md are read at the start of every session: a doc that
      # grows without a cap stops being read at all, and the session grep the
      # first 200 lines instead. The caps are checked, not trusted.
      # The docs caps and the translation catalogue are the two things that fail
      # *silently*: a doc nobody reads, and a French window with one English line
      # in it. Both are checked, not trusted.
      - name: Check the docs stay short
        run: python tools/docs_size.py

      # F-036 / T-014b: every translatable string the code carries has a finished
      # French translation, and the catalogue holds nothing the code lost.
      - name: Check the French catalogue is complete
        run: python tools/i18n_check.py
